[project]
name = "halo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax[cuda13]>=0.11.1",
    "jaxopt>=0.8.5",
    "matplotlib>=3.11.1",
    "torch>=2.13.0",
    "numpy>=2.5.2",
    "tqdm>=4.70.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages=["halo"]
include = ["*.py","*.toml",]
